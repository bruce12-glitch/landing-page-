version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vendorchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendorchain_user
      POSTGRES_PASSWORD: vendorchain_password
      POSTGRES_DB: vendorchain_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendorchain_user -d vendorchain_db']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    driver: local
